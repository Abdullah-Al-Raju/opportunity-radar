name: 24/7 Autonomous Publisher

on:
  schedule:
    # Runs 3 times daily: 06:00, 12:00, and 18:00 UTC
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of articles to auto-generate'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Generate and Index New Content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          SITE_URL: ${{ vars.SITE_URL || 'https://opportunity-radar-c60.pages.dev' }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY || 'opportunityradarindexnowkey' }}
        run: |
          COUNT="${{ github.event.inputs.count || '1' }}"
          python scripts/auto_publisher.py --count "$COUNT"

      - name: Commit and Push to Main
        run: |
          git config --global user.name "TechRadar Bot"
          git config --global user.email "bot@opportunity-radar-c60.pages.dev"
          git add src/content/posts/ data/topics.json public/img/posts/
          if git diff --staged --quiet; then
            echo "No new articles to commit."
          else
            git commit -m "Auto-published AI & Tech radar articles with cover images [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
